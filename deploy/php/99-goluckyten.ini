; /etc/php/8.4/fpm/conf.d/99-goluckyten.ini  (and /etc/php/8.4/cli/conf.d/ for artisan)
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; deploy.sh reloads PHP-FPM, so files aren't re-checked on every request
opcache.jit = tracing
opcache.jit_buffer_size = 64M

date.timezone = UTC

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D0A12">
<title>Offline — GoLuckyTen</title>
<style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0a12; color: #f5f2fa; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.6rem; margin: 20px 0 8px; }
    p { color: #a39bb4; margin: 0 0 24px; }
    button { background: #7b5cfa; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
    <img src="/images/brand/icon-192.png" alt="GoLuckyTen">
    <h1>You’re offline</h1>
    <p>Ticket numbers and prices need a connection. Your basket and tickets are safe.</p>
    <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>

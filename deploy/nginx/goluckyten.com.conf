# /etc/nginx/sites-available/goluckyten.com
# GoLuckyTen — Laravel on PHP-FPM 8.4, HTTPS via Let's Encrypt (certbot --nginx, certonly).

# HTTP: everything to HTTPS (certbot's nginx plugin adds its own challenge block while renewing).
server {
    listen 80;
    listen [::]:80;
    server_name goluckyten.com www.goluckyten.com;

    location / {
        return 301 https://goluckyten.com$request_uri;
    }
}

# HTTPS www -> apex.
server {
    # "listen ... http2" works on every nginx version (the "http2 on;" directive needs 1.25.1+)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goluckyten.com;

    ssl_certificate     /etc/letsencrypt/live/goluckyten.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goluckyten.com/privkey.pem;
    # Same TLS settings as the other certbot sites on this server
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://goluckyten.com$request_uri;
}

server {
    # "listen ... http2" works on every nginx version (the "http2 on;" directive needs 1.25.1+)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goluckyten.com;

    root /var/www/goluckyten.com/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/goluckyten.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goluckyten.com/privkey.pem;
    # Same TLS settings as the other certbot sites on this server
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Admin uploads prize photos and videos.
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/goluckyten.access.log;
    error_log  /var/log/nginx/goluckyten.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    # Until real payments are connected the checkout is simulated. Keep the site private:
    # sudo htpasswd -c /etc/nginx/.htpasswd-goluckyten deve   (package apache2-utils)
    # then uncomment the next two lines and reload nginx.
    # auth_basic "GoLuckyTen preview";
    # auth_basic_user_file /etc/nginx/.htpasswd-goluckyten;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite build files have a hash in the name: cache for a year.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # Service worker and manifest must never be cached, or updates won't reach installed apps.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        internal;
    }

    # No other PHP file is ever executed, and dotfiles (.env, .git) are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}

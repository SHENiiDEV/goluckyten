# Temporary config for the very first certificate: HTTP only, serves ACME challenges.
# Replace with goluckyten.com.conf once certbot has issued the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name goluckyten.com www.goluckyten.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 200 "GoLuckyTen: certificate setup in progress\n";
        default_type text/plain;
    }
}
